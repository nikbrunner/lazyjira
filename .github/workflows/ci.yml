name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: make lint
        run: make lint

      - name: make vet
        run: make vet

      - name: make build
        run: make build

      - name: test with coverage
        run: >-
          go test -race ./... -coverprofile=cover.out
          -covermode=atomic -coverpkg=./...

      - name: coverage summary
        run: |
          pct=$(go tool cover -func=cover.out |
            awk '/^total:/{gsub(/%/,"",$3); print $3}')
          {
            echo "## Coverage: ${pct}%"
            printf '%s%s\n' \
              '![coverage](https://img.shields.io/badge/' \
              "coverage-${pct}%25-blue)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: real Jira startup smoke
        run: python3 e2e/startup_smoke.py

      - name: make check-demo
        run: make check-demo
